[project]
name = "vllm-coherence-tools"
version = "0.1.0"
description = "Coherence conformance, diagnostics and persistent-session tools for pinned AMD inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5", "numpy>=2.3,<3", "safetensors>=0.6,<1",
  "tokenizers>=0.22,<1", "zstandard>=0.23,<1", "PyYAML>=6", "psutil>=6", "requests>=2",
]

[project.scripts]
coherence-conformance = "qwen_r9700_lab.conformance_cli:main"
qwen-conformance = "qwen_r9700_lab.conformance_cli:main"
coherence-cache = "qwen_r9700_lab.radiance_cache_cli:main"

[project.optional-dependencies]
cpu-tests = ["torch>=2.14.0"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "z3-solver>=4.13", "pydantic>=2,<3", "regex>=2025.7.34", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_r9700_lab"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
