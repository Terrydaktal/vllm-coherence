name: CPU verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --frozen --extra cpu-tests --python 3.12
      - run: uv run --frozen --extra cpu-tests pytest -q --junitxml=test-results.xml
      - run: python3 tools/check_publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-results
          path: test-results.xml
